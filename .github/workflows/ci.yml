name: CI

# Each service (backend, frontend, ai) has its own CI in its own repository.
# This workflow validates what belongs to the orchestration repository itself.

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  submodules:
    name: Submodule pointers
    runs-on: ubuntu-latest
    steps:
      # Fails if a submodule points to a commit that was never pushed to its repository.
      - name: Check out repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show pinned commits
        run: git submodule status

  terraform:
    name: Terraform (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [gcp, aws]
    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Check formatting
        run: terraform fmt -check -recursive ../..

      - name: Initialize (no backend)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create .env from template
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose config --quiet

  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check relative links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress README.md 'docs/**/*.md' 'terraform/**/*.md'
          fail: true
