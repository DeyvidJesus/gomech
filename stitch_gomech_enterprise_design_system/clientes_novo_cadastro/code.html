<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GoMech - Add Client</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#551d00",
                        "error-container": "#ffdad6",
                        "secondary": "#555f6f",

                        "surface-container": "#ffe9e2",

                        "secondary-fixed-dim": "#bdc7d9",
                        "inverse-on-surface": "#ffede7",
                        "on-secondary-fixed": "#121c2a",
                        "secondary-container": "#d6e0f3",

                        "on-primary": "#ffffff",

                        "error": "#ba1a1a",
                        "surface-variant": "#f8ddd2",
                        "surface-container-high": "#fee2d8",
                        "on-secondary-container": "#596373",
                        "inverse-surface": "#3d2d26",
                        "surface-tint": "#a33e00",
                        "surface": "#fff8f6",
                        "on-surface": "#271812",
                        "surface-dim": "#f0d4ca",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed": "#002109",
                        "tertiary-fixed-dim": "#4ae176",
                        "on-background": "#271812",
                        "inverse-primary": "#ffb596",
                        "background": "#fff8f6",
                        "outline-variant": "#e3bfb1",
                        "primary-fixed": "#ffdbcd",
                        "surface-bright": "#fff8f6",
                        "on-tertiary": "#ffffff",
                        "surface-container-highest": "#f8ddd2",
                        "tertiary": "#006e2f",
                        "on-tertiary-container": "#003714",
                        "on-surface-variant": "#5a4136",
                        "on-secondary": "#ffffff",
                        "primary": "#a33e00",
                        "on-secondary-fixed-variant": "#3d4756",
                        "tertiary-fixed": "#6bff8f",
                        "secondary-fixed": "#d9e3f6",
                        "on-error": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#ff6500"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "xs": "4px",
                        "lg": "24px",
                        "md": "16px",
                        "base": "4px",
                        "2xl": "48px",
                        "xl": "32px",
                        "gutter": "20px",
                        "topbar-height": "64px",
                        "sm": "8px",
                        "sidebar-width": "260px",
                        "3xl": "64px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Manrope"],
                        "label-sm": ["Inter"],
                        "display-lg": ["Manrope"],

                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],

<style>
        body { background-color: #F7F8FA; }
        .input-focus-ring:focus { outline: none; border-color: #a33e00; box-shadow: 0 0 0 3px rgba(163, 62, 0, 0.2); }
    </style>
</head>
<body class="font-body-md text-body-md text-on-surface min-h-screen flex flex-col md:flex-row">
<!-- SideNavBar (Hidden on intent: Transactional Form / Sub-page) -->
<!-- Content intent is highly focused (Adding a client), thus navigation is suppressed to prioritize canvas. -->
<!-- Main Content Area -->
<main class="flex-1 w-full max-w-4xl mx-auto py-xl px-md lg:px-lg mt-topbar-height md:mt-0 flex flex-col h-screen overflow-y-auto">
<!-- Header -->
<header class="flex items-center justify-between mb-xl pb-md border-b border-outline-variant">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface hover:bg-surface-container transition-colors border border-outline-variant">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Add New Client</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Register personal details and initial vehicle.</p>
</div>
</div>
<div class="hidden md:flex gap-3">
<button class="px-6 py-2 rounded-lg font-label-md text-label-md text-primary hover:bg-surface border border-transparent transition-colors">Cancel</button>
<button class="px-6 py-2 rounded-lg font-label-md text-label-md bg-primary text-on-primary hover:bg-[#E85D00] transition-colors shadow-sm transform active:translate-y-px">Save Client</button>
</div>
</header>
<!-- Form Container -->
<div class="flex-1 flex flex-col gap-lg pb-3xl">
<!-- Section: Personal Information -->
<section class="bg-surface rounded-xl border border-outline-variant p-lg shadow-sm">
<div class="flex items-center gap-2 mb-md border-b border-outline-variant pb-sm">
<span class="material-symbols-outlined text-primary" data-icon="person">person</span>
<h2 class="font-headline-sm text-headline-sm text-on-surface">Personal Details</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-lg gap-y-md mt-md">
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="fullName">Full Name *</label>
<input class="h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface input-focus-ring font-body-md text-body-md w-full" id="fullName" placeholder="John Doe" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="docId">CPF / CNPJ *</label>
<input class="h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface input-focus-ring font-body-md text-body-md w-full" id="docId" placeholder="000.000.000-00" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">Email Address</label>
<input class="h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface input-focus-ring font-body-md text-body-md w-full" id="email" placeholder="john@example.com" type="email"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="phone">Phone Number *</label>
<input class="h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface input-focus-ring font-body-md text-body-md w-full" id="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
</section>
<!-- Section: Address -->
<section class="bg-surface rounded-xl border border-outline-variant p-lg shadow-sm">
<div class="flex items-center gap-2 mb-md border-b border-outline-variant pb-sm">
<span class="material-symbols-outlined text-primary" data-icon="location_on">location_on</span>
<h2 class="font-headline-sm text-headline-sm text-on-surface">Billing Address</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-6 gap-x-lg gap-y-md mt-md">
<div class="flex flex-col gap-2 md:col-span-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="zip">ZIP Code</label>
<input class="h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface input-focus-ring font-body-md text-body-md w-full" id="zip" placeholder="00000-000" type="text"/>
</div>
<div class="flex flex-col gap-2 md:col-span-4">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="street">Street Address</label>
<input class="h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface input-focus-ring font-body-md text-body-md w-full" id="street" placeholder="Main St" type="text"/>
</div>
<div class="flex flex-col gap-2 md:col-span-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="number">Number</label>
<input class="h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface input-focus-ring font-body-md text-body-md w-full" id="number" placeholder="123" type="text"/>
</div>
<div class="flex flex-col gap-2 md:col-span-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="city">City</label>
<input class="h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface input-focus-ring font-body-md text-body-md w-full" id="city" placeholder="Cityville" type="text"/>
</div>
<div class="flex flex-col gap-2 md:col-span-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="state">State</label>
<select class="h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface input-focus-ring font-body-md text-body-md w-full appearance-none" id="state">
<option>Select State</option>
<option>NY</option>
<option>CA</option>
</select>
</div>
</div>
</section>
<!-- Section: Optional Vehicle -->
<section class="bg-surface rounded-xl border border-outline-variant p-lg shadow-sm relative overflow-hidden">
<div class="absolute top-0 left-0 w-1 h-full bg-secondary-fixed-dim"></div>
<div class="flex items-center justify-between mb-md border-b border-outline-variant pb-sm">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-secondary-fixed-dim" data-icon="directions_car">directions_car</span>
<h2 class="font-headline-sm text-headline-sm text-on-surface">First Vehicle <span class="text-on-surface-variant font-body-sm text-body-sm font-normal">(Optional)</span></h2>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-x-lg gap-y-md mt-md">
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="plate">License Plate</label>
<input class="h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface input-focus-ring font-body-md text-body-md w-full uppercase" id="plate" placeholder="ABC-1234" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="make">Make / Brand</label>
<input class="h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface input-focus-ring font-body-md text-body-md w-full" id="make" placeholder="Toyota" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="model">Model &amp; Year</label>
<input class="h-12 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface input-focus-ring font-body-md text-body-md w-full" id="model" placeholder="Corolla 2022" type="text"/>
</div>
</div>
<div class="mt-md flex justify-end">
<button class="px-4 py-2 rounded-lg font-label-md text-label-md text-primary hover:bg-surface-container transition-colors flex items-center gap-2">
<span class="material-symbols-outlined" data-icon="add" style="font-size: 18px;">add</span>
                        Add Another Vehicle
                    </button>
</div>
</section>
<!-- Mobile Sticky Footer Actions -->
<div class="md:hidden fixed bottom-0 left-0 w-full bg-surface border-t border-outline-variant p-md flex gap-3 z-10 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
<button class="flex-1 py-3 rounded-lg font-label-md text-label-md text-on-surface border border-outline-variant bg-surface hover:bg-surface-container transition-colors">Cancel</button>
<button class="flex-1 py-3 rounded-lg font-label-md text-label-md bg-primary text-on-primary hover:bg-[#E85D00] transition-colors shadow-sm">Save Client</button>
</div>
</div>
</main>
</body></html>
