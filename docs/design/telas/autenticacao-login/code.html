<!DOCTYPE html>

                        "surface-container-lowest": "#ffffff",

                        "on-tertiary-container": "#003714",

                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }]

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Subtle pattern for background */
        .bg-pattern {
            background-image: radial-gradient(var(--tw-colors-outline-variant) 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.3;
        }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Decorative Background Elements -->
<div class="absolute inset-0 bg-pattern pointer-events-none"></div>
<div class="absolute top-[-10%] right-[-5%] w-[40%] h-[40%] bg-primary-container rounded-full blur-[120px] opacity-20 pointer-events-none"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[30%] h-[30%] bg-tertiary-container rounded-full blur-[100px] opacity-10 pointer-events-none"></div>
<!-- Login Container -->
<main class="w-full max-w-[440px] px-md relative z-10">
<!-- Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm p-xl flex flex-col gap-xl">
<!-- Header -->
<div class="flex flex-col items-center text-center gap-sm">
<div class="h-12 mb-2 flex items-center justify-center">
<!-- Assuming IMAGE_1 is the logo -->
<img alt="GoMech Logo" class="h-full w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDdnByAkrf7UCdPUToaIUtNSmC6OKojORVxbC8QKuDw8iRSvNndFgyhuPS8WYAwtS4Ik3DEbZDLyfsB4WDUD-wH038jWQkI2adctHti_yOeXiiNhJj3dOm45Ezg6apUHuzVu14mu2Xxbg08v4IxeZmVC8jo_q9usHPY929uhNpz2YRVDDpqE6Gn0DyrJsQNv0Q9eVVOdeEjjb15Rz6NkTHjDLhI6pqlCJd4uSONE1UWzKmt39Ce-DgpbGEEEpiClRWHjQGYTx07pZg"/>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to your GoMech workspace.</p>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-lg" method="POST">
<!-- Input Group: Email -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">mail</span>
<input class="w-full h-[48px] pl-10 pr-md rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors placeholder:text-outline" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Input Group: Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">lock</span>
<input class="w-full h-[48px] pl-10 pr-[40px] rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors placeholder:text-outline" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface focus:outline-none flex items-center justify-center" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibilityIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember & Forgot -->
<div class="flex items-center justify-between mt-[-8px]">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-4 h-4 border border-outline-variant rounded bg-surface-container-lowest checked:bg-primary checked:border-primary focus:ring-2 focus:ring-primary-fixed focus:ring-offset-1 focus:ring-offset-surface-container-lowest transition-all cursor-pointer" type="checkbox"/>
<span class="material-symbols-outlined absolute text-[12px] text-on-primary opacity-0 peer-checked:opacity-100 pointer-events-none">check</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Submit Action -->
<button class="w-full h-[48px] flex items-center justify-center rounded-lg bg-primary text-on-primary font-label-md text-label-md hover:bg-primary-container active:translate-y-[1px] transition-all shadow-sm" type="submit">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-md">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-body-sm text-body-sm text-on-surface-variant">Or continue with</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-md">
<button class="h-[48px] flex items-center justify-center gap-sm rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-label-md text-label-md hover:bg-surface-container transition-colors active:translate-y-[1px]" type="button">
<!-- Inline SVG for Google Logo -->
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Google
                </button>
<button class="h-[48px] flex items-center justify-center gap-sm rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-label-md text-label-md hover:bg-surface-container transition-colors active:translate-y-[1px]" type="button">
<!-- Inline SVG for Apple Logo -->
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.04 2.26-.79 3.59-.76 1.76.04 3.19.78 4.07 2.11-3.4 2.16-2.88 6.57.51 7.9-1.02 2.38-2.14 4.07-3.25 5.23v-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"></path>
</svg>
                    Apple
                </button>
</div>
</div>
<!-- Footer -->
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? 
                <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Sign up</a>
</p>
</div>
</main>
<!-- Script for interaction -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleButton = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibilityIcon');

            toggleButton.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    visibilityIcon.textContent = 'visibility_off';
                } else {
                    passwordInput.type = 'password';
                    visibilityIcon.textContent = 'visibility';
                }
            });
        });
    </script>
</body></html>
